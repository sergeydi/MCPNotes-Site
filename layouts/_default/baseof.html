<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — MCP Notes{{ end }}</title>
<meta name="description" content="{{ .Params.summary | default site.Params.description }}">
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
<div class="shell">
  <main class="main">
    {{ partial "header.html" . }}
    <div class="content">
      {{ block "main" . }}{{ end }}
    </div>
    {{ partial "footer.html" . }}
  </main>
</div>
</body>
</html>
